<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Grocery · Listening</title>
<style>
  :root{--paper:#FAF8F3;--ink:#23211C;--soft:#6B675E;--faint:#A8A29A;--sage:#7C8C6F;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{width:390px;height:844px;margin:0 auto;color:var(--ink);
    font-family:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;
    /* sage wash over paper */
    background:linear-gradient(180deg,#EEF1E9 0%, #E7ECE0 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .circle{width:130px;height:130px;border-radius:50%;background:var(--sage);
    animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{
    0%{transform:scale(.82);box-shadow:0 0 0 0 rgba(124,140,111,.45);}
    70%{transform:scale(1);box-shadow:0 0 0 42px rgba(124,140,111,0);}
    100%{transform:scale(.82);box-shadow:0 0 0 0 rgba(124,140,111,0);}
  }
  .label{font-size:16px;color:var(--soft);}
  .heard{position:absolute;bottom:120px;left:36px;right:36px;text-align:center;
    font-family:"DM Serif Display",Georgia,serif;font-size:22px;line-height:1.3;color:var(--ink);opacity:.9;}
  .hint{position:absolute;bottom:80px;left:0;right:0;text-align:center;font-size:12px;color:var(--faint);
    font-variant-caps:all-small-caps;letter-spacing:.12em;}
</style>
</head>
<body>
  <div class="circle"></div>
  <div class="label">listening… just pause when you're done</div>
  <div class="heard">"out of lemons, and I bought two oat milks"</div>
  <div class="hint">it stops on its own · routes itself</div>
</body>
</html>
