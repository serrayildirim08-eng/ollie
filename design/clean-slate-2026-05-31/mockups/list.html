<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Grocery · List</title>
<style>
  :root{--paper:#FAF8F3;--ink:#23211C;--soft:#6B675E;--faint:#A8A29A;--hair:#EAE5DB;--sage:#7C8C6F;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{width:390px;height:844px;margin:0 auto;background:var(--paper);color:var(--ink);
    font-family:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400;}
  .smcp{font-variant-caps:all-small-caps;letter-spacing:.13em;font-size:11px;color:var(--faint);}
  .spine{display:flex;gap:24px;padding:18px 28px 0;}
  .spine a{font-size:14px;color:var(--faint);text-decoration:none;padding-bottom:7px;font-weight:500;}
  .spine a.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--sage);}
  .scroll{flex:1;overflow:auto;padding:0 28px;}
  h1.serif{font-size:30px;margin:30px 0 6px;letter-spacing:-.01em;}
  .sub{color:var(--soft);font-size:14px;margin-bottom:18px;}
  .row{display:flex;align-items:center;gap:16px;padding:15px 0;border-top:1px solid var(--hair);}
  .tick{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--faint);flex:none;}
  .name{font-size:18px;}
  .name .qty{color:var(--faint);font-size:14px;margin-left:6px;}
  .done .name{color:var(--faint);text-decoration:line-through;}
  .done .tick{border-color:var(--sage);background:var(--sage);position:relative;}
  .done .tick:after{content:"";position:absolute;left:6px;top:3px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .pred{margin-top:26px;}
  .pred .smcp{display:block;margin-bottom:4px;}
  .prow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--hair);}
  .prow .pn{font-size:17px;color:var(--faint);}
  .prow .add{font-size:12px;color:var(--sage);font-weight:600;font-variant-caps:all-small-caps;letter-spacing:.08em;}
  .dump{margin:0 16px 14px;border:1px solid var(--hair);border-radius:14px;background:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px;}
  .dump .ph{flex:1;color:var(--faint);font-size:15px;}.dump .ic{color:var(--faint);}
  .dump .send{width:34px;height:34px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;color:#fff;}
  svg{display:block;}
</style>
</head>
<body>
  <nav class="spine"><a href="now.html">now</a><a class="on" href="#">list</a><a href="kitchen.html">kitchen</a><a href="cook.html">cook</a></nav>
  <div class="scroll">
    <h1 class="serif">To buy</h1>
    <div class="sub">tap a circle when it's in the cart — it moves to your kitchen.</div>

    <div class="row"><span class="tick"></span><span class="name">lemons <span class="qty">· need</span></span></div>
    <div class="row"><span class="tick"></span><span class="name">oat milk <span class="qty">2</span></span></div>
    <div class="row"><span class="tick"></span><span class="name">chicken thighs</span></div>
    <div class="row done"><span class="tick"></span><span class="name">garlic</span></div>
    <div class="row"><span class="tick"></span><span class="name">parmesan</span></div>

    <div class="pred">
      <span class="smcp">≈ likely needed soon</span>
      <div class="prow"><span class="pn">coffee</span><span class="add">+ add</span></div>
      <div class="prow"><span class="pn">dish soap</span><span class="add">+ add</span></div>
    </div>
  </div>
  <div class="dump">
    <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg></span>
    <span class="ph">add to the list…</span>
    <div class="send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
  </div>
</body>
</html>
