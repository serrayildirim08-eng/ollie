<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Grocery · Kitchen</title>
<style>
  :root{--paper:#FAF8F3;--ink:#23211C;--soft:#6B675E;--faint:#A8A29A;--hair:#EAE5DB;--sage:#7C8C6F;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{width:390px;height:844px;margin:0 auto;background:var(--paper);color:var(--ink);
    font-family:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400;}
  .smcp{font-variant-caps:all-small-caps;letter-spacing:.13em;font-size:11px;color:var(--faint);}
  .spine{display:flex;gap:24px;padding:18px 28px 0;}
  .spine a{font-size:14px;color:var(--faint);text-decoration:none;padding-bottom:7px;font-weight:500;}
  .spine a.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--sage);}
  .scroll{flex:1;overflow:auto;padding:0 28px;}
  h1.serif{font-size:30px;margin:30px 0 6px;letter-spacing:-.01em;}
  .sub{color:var(--soft);font-size:14px;margin-bottom:20px;}
  .item{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0;border-top:1px solid var(--hair);}
  .item .n{font-size:18px;}
  .item .q{font-size:13px;color:var(--faint);}
  /* aging = opacity of the item's own ink */
  .fresh .n{opacity:1;}
  .faded .n{opacity:.55;}
  .old .n{opacity:.4;}
  .prompt{padding:14px 0;border-top:1px solid var(--hair);}
  .prompt .n{font-size:18px;opacity:.4;}
  .prompt .ask{margin-top:9px;display:flex;gap:18px;}
  .prompt .ask span{font-size:13px;font-weight:600;}
  .prompt .yes{color:var(--sage);}
  .prompt .no{color:var(--faint);}
  .low{font-size:11px;color:var(--sage);font-variant-caps:all-small-caps;letter-spacing:.08em;margin-left:8px;}
  .arch{margin-top:26px;padding-top:16px;border-top:1px solid var(--hair);font-size:13px;color:var(--faint);display:flex;justify-content:space-between;}
  .dump{margin:0 16px 14px;border:1px solid var(--hair);border-radius:14px;background:#fff;padding:14px 16px;display:flex;align-items:center;gap:14px;}
  .dump .ph{flex:1;color:var(--faint);font-size:15px;}.dump .ic{color:var(--faint);}
  .dump .send{width:34px;height:34px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;color:#fff;}
  svg{display:block;}
</style>
</head>
<body>
  <nav class="spine"><a href="now.html">now</a><a href="list.html">list</a><a class="on" href="#">kitchen</a><a href="cook.html">cook</a></nav>
  <div class="scroll">
    <h1 class="serif">In the kitchen</h1>
    <div class="sub">older things quietly fade. nothing nags.</div>

    <div class="item fresh"><span class="n">eggs <span class="low">running low</span></span><span class="q">6</span></div>
    <div class="item fresh"><span class="n">olive oil</span><span class="q">1 bottle</span></div>
    <div class="item fresh"><span class="n">rice</span><span class="q">1 kg</span></div>
    <div class="item faded"><span class="n">chicken thighs</span><span class="q">4 days</span></div>
    <div class="item faded"><span class="n">yogurt</span><span class="q">·</span></div>
    <div class="item old"><span class="n">parmesan</span><span class="q">·</span></div>

    <div class="prompt">
      <div class="n">spinach</div>
      <div class="ask"><span class="yes">still good</span><span class="no">it's gone</span></div>
    </div>

    <div class="arch"><span>archived · 7</span><span>show</span></div>
  </div>
  <div class="dump">
    <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg></span>
    <span class="ph">"bought 12 eggs", "used the milk"…</span>
    <div class="send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
  </div>
</body>
</html>
