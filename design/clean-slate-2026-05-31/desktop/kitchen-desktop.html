<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Grocery · Kitchen · desktop</title>
<style>
  :root{--paper:#FAF8F3;--ink:#23211C;--soft:#6B675E;--faint:#A8A29A;--hair:#EAE5DB;--sage:#7C8C6F;--rail:#F2EFE8;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{width:1100px;height:720px;margin:0 auto;background:var(--paper);color:var(--ink);
    font-family:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;display:flex;}
  .serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400;}
  .smcp{font-variant-caps:all-small-caps;letter-spacing:.14em;font-size:12px;color:var(--faint);}
  .spine{width:84px;flex:none;background:var(--rail);border-right:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;padding:26px 0;}
  .spine .mark{width:12px;height:12px;border-radius:50%;background:var(--sage);margin-bottom:46px;}
  .spine nav{display:flex;flex-direction:column;gap:30px;align-items:center;}
  .spine a{writing-mode:vertical-rl;transform:rotate(180deg);font-variant-caps:all-small-caps;letter-spacing:.18em;font-size:13px;color:var(--faint);text-decoration:none;font-weight:500;}
  .spine a.on{color:var(--ink);font-weight:600;}
  .main{flex:1;display:flex;flex-direction:column;}
  .canvas{flex:1;padding:56px 80px 0;overflow:auto;}
  h1.serif{font-size:34px;letter-spacing:-.01em;margin-bottom:4px;}
  .sub{color:var(--soft);font-size:14px;margin-bottom:30px;}
  .cols{columns:2;column-gap:80px;max-width:860px;}
  .item{display:flex;align-items:baseline;justify-content:space-between;padding:13px 0;border-top:1px solid var(--hair);break-inside:avoid;}
  .item .n{font-size:17px;}.item .q{font-size:12px;color:var(--faint);}
  .fresh .n{opacity:1;}.faded .n{opacity:.55;}.old .n{opacity:.4;}
  .low{font-size:10px;color:var(--sage);font-variant-caps:all-small-caps;letter-spacing:.08em;margin-left:8px;}
  .prompt{padding:13px 0;border-top:1px solid var(--hair);break-inside:avoid;}
  .prompt .n{font-size:17px;opacity:.4;}
  .prompt .ask{margin-top:8px;display:flex;gap:16px;}
  .prompt .ask span{font-size:13px;font-weight:600;}.prompt .yes{color:var(--sage);}.prompt .no{color:var(--faint);}
  .arch{margin:30px 0 0;max-width:860px;padding-top:16px;border-top:1px solid var(--hair);font-size:13px;color:var(--faint);display:flex;justify-content:space-between;}
  .dock{padding:22px 80px 30px;}
  .dump{border:1px solid var(--hair);border-radius:16px;background:#fff;padding:16px 20px;display:flex;align-items:center;gap:18px;max-width:760px;}
  .dump .ph{flex:1;color:var(--faint);font-size:16px;}.dump .ic{color:var(--faint);}.dump .kbd{font-size:11px;color:var(--faint);border:1px solid var(--hair);border-radius:6px;padding:3px 7px;}
  svg{display:block;}
</style>
</head>
<body>
  <aside class="spine"><div class="mark"></div><nav><a href="now-desktop.html">now</a><a href="list-desktop.html">list</a><a class="on" href="#">kitchen</a><a href="cook-desktop.html">cook</a></nav></aside>
  <div class="main">
    <div class="canvas">
      <h1 class="serif">In the kitchen</h1>
      <div class="sub">older things quietly fade. nothing nags.</div>
      <div class="cols">
        <div class="item fresh"><span class="n">eggs <span class="low">running low</span></span><span class="q">6</span></div>
        <div class="item fresh"><span class="n">olive oil</span><span class="q">1 bottle</span></div>
        <div class="item fresh"><span class="n">rice</span><span class="q">1 kg</span></div>
        <div class="item fresh"><span class="n">pasta</span><span class="q">2 packs</span></div>
        <div class="item faded"><span class="n">chicken thighs</span><span class="q">4 days</span></div>
        <div class="item faded"><span class="n">yogurt</span><span class="q">·</span></div>
        <div class="item faded"><span class="n">butter</span><span class="q">·</span></div>
        <div class="item old"><span class="n">parmesan</span><span class="q">·</span></div>
        <div class="prompt"><div class="n">spinach</div><div class="ask"><span class="yes">still good</span><span class="no">it's gone</span></div></div>
      </div>
      <div class="arch"><span>archived · 7</span><span>show</span></div>
    </div>
    <div class="dock"><div class="dump"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg></span><span class="ph">"bought 12 eggs", "used the milk"…</span><span class="kbd">⌘↵</span></div></div>
  </div>
</body>
</html>
