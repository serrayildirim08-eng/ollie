<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ollie · Cycle — log today</title>
<style>
  :root{
    --paper:#FAF6EF; --ink:#2A2622; --mute:#B6ADA0; --line:#EAE2D4;
    --accent:#C9923E; --sage:#5B8C7E;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:#d8d0c2;
    display:flex;align-items:center;justify-content:center}
  .phone{width:390px;height:844px;background:var(--paper);position:relative;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.32);display:flex;flex-direction:column}
  .status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:var(--ink)}
  /* swipe-down handle dismisses — same return gesture everywhere */
  .handle{position:absolute;top:64px;left:0;right:0;display:flex;justify-content:center}
  .handle div{width:38px;height:5px;border-radius:3px;background:var(--line)}

  .who{position:absolute;top:104px;left:0;right:0;display:flex;
    align-items:center;justify-content:center;gap:9px}
  .who span{font-size:14px;font-weight:600;color:var(--mute);letter-spacing:.04em}

  .scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;
    padding:0 26px 36px}

  /* the lead — one calm line, day stated so the log has context */
  .lead{margin-top:116px;font-size:22px;font-weight:300;color:var(--ink);
    letter-spacing:-.02em}
  .lead b{font-weight:500}
  .sub{margin-top:6px;font-size:13px;color:var(--mute);font-weight:500}

  /* symptom tag chips — calm, wrap, tap to toggle. selected = sage fill. */
  .sect{margin-top:32px}
  .sectk{font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.08em;
    text-transform:uppercase}
  .chips{margin-top:14px;display:flex;flex-wrap:wrap;gap:9px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:18px;
    padding:9px 15px;font-size:14px;font-weight:500;color:var(--ink);
    letter-spacing:-.01em}
  .chip.on{background:var(--sage);border-color:var(--sage);color:#fff}

  /* free-text note line — one quiet underline, never a big box */
  .note{margin-top:30px;border-bottom:1px solid var(--line);padding-bottom:11px;
    display:flex;align-items:center;gap:9px}
  .note svg{stroke:var(--mute);flex-shrink:0}
  .note span{font-size:15px;color:var(--mute);font-weight:400;letter-spacing:-.01em}

  /* the distinct bleeding-day-1 action — starts a new cycle. set apart
     with air and an amber hairline so it never reads as just a chip. */
  .bleed{margin-top:34px;border:1.5px solid var(--accent);border-radius:18px;
    padding:16px 18px;display:flex;align-items:center;gap:13px;background:#FCF4E6}
  .bdot{width:11px;height:11px;border-radius:50%;background:var(--accent);
    flex-shrink:0}
  .btext{flex:1;display:flex;flex-direction:column;gap:2px}
  .btext .bk{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  .btext .bs{font-size:12px;color:#9A7A45;font-weight:500}
  .bleed .chev{stroke:var(--accent);flex-shrink:0}

  /* save — full-width amber, the one commit */
  .save{margin-top:32px;height:52px;border-radius:26px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 12px 28px rgba(201,146,62,.32)}
  .save svg{stroke:#fff}
  .save span{font-size:16px;font-weight:600;color:#fff;letter-spacing:-.01em}
  /* the saved confirmation — dry, lowercase, period */
  .saved{margin-top:16px;text-align:center;font-size:13px;color:var(--sage);
    font-weight:600;letter-spacing:.01em}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
  <div class="handle"><div></div></div>

  <div class="who">
    <span>log today</span>
  </div>

  <div class="scroll">
    <div class="lead"><b>how is today</b></div>
    <div class="sub">day 14 · luteal</div>

    <div class="sect">
      <div class="sectk">symptoms</div>
      <div class="chips">
        <span class="chip on">cramps</span>
        <span class="chip">bloating</span>
        <span class="chip on">fatigue</span>
        <span class="chip">headache</span>
        <span class="chip">mood</span>
        <span class="chip">bleeding</span>
        <span class="chip">spotting</span>
        <span class="chip">cravings</span>
        <span class="chip">tender</span>
        <span class="chip">clear</span>
      </div>
    </div>

    <div class="note">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="1.8">
        <path d="M4 20h16M5 16l9.5-9.5a2 2 0 0 1 3 3L8 19l-4 1z"/>
      </svg>
      <span>add a note&hellip;</span>
    </div>

    <!-- the distinct bleeding-day-1 action — starts a new cycle -->
    <div class="bleed">
      <span class="bdot"></span>
      <div class="btext">
        <span class="bk">bleeding — day 1</span>
        <span class="bs">starts a new cycle</span>
      </div>
      <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <div class="save">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.4"><path d="M5 13l4 4 10-11"/></svg>
      <span>save</span>
    </div>
    <div class="saved">noted.</div>
  </div>
</div>
</body>
</html>
