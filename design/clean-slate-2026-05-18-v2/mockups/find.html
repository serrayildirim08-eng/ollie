<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ollie · Find</title>
<style>
  :root{
    --paper:#FAF6EF; --ink:#2A2622; --mute:#B6ADA0; --line:#EAE2D4;
    --accent:#C9923E;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:#d8d0c2;
    display:flex;align-items:center;justify-content:center}
  .phone{width:390px;height:844px;background:var(--paper);position:relative;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.32);display:flex;flex-direction:column}
  .status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:var(--ink)}
  /* swipe-down handle dismisses Find — same return gesture everywhere */
  .handle{position:absolute;top:64px;left:0;right:0;display:flex;justify-content:center}
  .handle div{width:38px;height:5px;border-radius:3px;background:var(--line)}

  .body{flex:1;padding:108px 24px 26px;display:flex;flex-direction:column}

  /* the search field — one calm input, the focus of this screen */
  .field{display:flex;align-items:center;gap:13px;background:#fff;
    border:1px solid var(--line);border-radius:18px;padding:16px 18px;
    box-shadow:0 10px 26px rgba(42,38,34,.05)}
  .field svg{stroke:var(--mute);flex-shrink:0}
  .field .typed{font-size:18px;color:var(--ink);font-weight:400;letter-spacing:-.01em}
  .caret{width:2px;height:21px;background:var(--accent);margin-left:1px;
    animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{opacity:0}}

  /* a quiet result count — concrete, not chrome for its own sake */
  .count{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.04em;
    margin:24px 4px 12px;text-transform:lowercase}

  /* results wear the same info-card grammar as the module pages */
  .res{background:#fff;border:1px solid var(--line);border-radius:18px;
    box-shadow:0 8px 22px rgba(42,38,34,.04);display:flex;align-items:center;
    gap:14px;padding:15px 16px;margin-bottom:10px}
  .ri{width:40px;height:40px;border-radius:12px;background:#F2EEDF;flex-shrink:0;
    display:flex;align-items:center;justify-content:center}
  .ri svg{stroke:var(--accent)}
  .rt{flex:1;min-width:0}
  .rname{font-size:16px;font-weight:400;color:var(--ink);letter-spacing:-.012em}
  .rname em{font-style:normal;color:var(--accent);font-weight:600}
  /* the path crumb — tells you where it lives, so you can FIND it again */
  .rpath{font-size:12px;color:var(--mute);font-weight:500;margin-top:2px}
  .rgo{flex-shrink:0;stroke:var(--mute)}

  /* the search reaches everything: a thrown thought, a submodule's data,
     a grocery line, a goal. one place, the whole notebook. */
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
  <div class="handle"><div></div></div>

  <div class="body">
    <div class="field">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>
      </svg>
      <span class="typed">pass</span><span class="caret"></span>
    </div>

    <div class="count">4 across the notebook</div>

    <!-- a thrown thought -->
    <div class="res">
      <div class="ri">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
          <path d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
      </div>
      <div class="rt">
        <div class="rname">renew my <em>pass</em>port before June</div>
        <div class="rpath">caught · 3 days ago</div>
      </div>
      <svg class="rgo" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <!-- a submodule's live data -->
    <div class="res">
      <div class="ri">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
          <path d="M7 3h7l5 5v13H7z"/><path d="M13 3v6h6M10 13h7M10 17h7"/>
        </svg>
      </div>
      <div class="rt">
        <div class="rname"><em>pass</em>port renewal · due in 9 days</div>
        <div class="rpath">home &rsaquo; admin</div>
      </div>
      <svg class="rgo" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <!-- a goal -->
    <div class="res">
      <div class="ri">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/>
        </svg>
      </div>
      <div class="rt">
        <div class="rname">get a <em>pass</em>port for the trip</div>
        <div class="rpath">work &rsaquo; goals · 40%</div>
      </div>
      <svg class="rgo" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <!-- a whole submodule, jumped to by name -->
    <div class="res">
      <div class="ri">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
          <rect x="3" y="9" width="18" height="10" rx="5" transform="rotate(-45 12 14)"/><path d="M9 7l8 8"/>
        </svg>
      </div>
      <div class="rt">
        <div class="rname">medication</div>
        <div class="rpath">body &rsaquo; jump to submodule</div>
      </div>
      <svg class="rgo" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>
</div>
</body>
</html>
