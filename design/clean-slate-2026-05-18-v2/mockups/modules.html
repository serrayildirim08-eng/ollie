<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ollie · Modules</title>
<style>
  :root{
    --paper:#FAF6EF; --ink:#2A2622; --mute:#B6ADA0; --line:#EAE2D4;
    --accent:#C9923E;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:#d8d0c2;
    display:flex;align-items:center;justify-content:center}
  .phone{width:390px;height:844px;background:var(--paper);position:relative;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.32);display:flex;flex-direction:column}
  .status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:var(--ink)}
  /* always-on Safe dot */
  .safe{position:absolute;top:62px;right:24px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .safe svg{stroke:var(--mute)}

  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:0 30px;gap:14px}

  /* THE ONE THING — four calm rooms, one word each. no titles, no counts. */
  .room{display:flex;align-items:center;gap:22px;padding:22px 22px;
    background:#fff;border:1px solid var(--line);border-radius:24px;
    box-shadow:0 12px 30px rgba(42,38,34,.05)}
  .ic{width:54px;height:54px;border-radius:16px;background:#F2EEDF;flex-shrink:0;
    display:flex;align-items:center;justify-content:center}
  .ic svg{stroke:var(--accent)}
  .word{font-size:27px;font-weight:400;color:var(--ink);letter-spacing:-.015em}

  /* position dots — modules is one swipe past the capture screens */
  .dots{position:absolute;bottom:38px;left:0;right:0;display:flex;
    gap:9px;justify-content:center}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--ink);width:22px;border-radius:3px}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
  <div class="safe">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>
    </svg>
  </div>

  <div class="stage">
    <!-- money -->
    <div class="room">
      <div class="ic">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.2a2.5 2 0 0 1 5 0c0 2.6-5 1.4-5 4a2.5 2 0 0 0 5 0"/>
        </svg>
      </div>
      <div class="word">money</div>
    </div>
    <!-- body -->
    <div class="room">
      <div class="ic">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
          <path d="M12 21c-1-6-7-7-7-12a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5-6 6-7 12z"/>
        </svg>
      </div>
      <div class="word">body</div>
    </div>
    <!-- home -->
    <div class="room">
      <div class="ic">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
          <path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/>
        </svg>
      </div>
      <div class="word">home</div>
    </div>
    <!-- work -->
    <div class="room">
      <div class="ic">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
          <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </div>
      <div class="word">work</div>
    </div>
  </div>

  <div class="dots"><i></i><i></i><i></i><i class="on"></i></div>
</div>
</body>
</html>
