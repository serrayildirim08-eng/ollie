<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ollie · Money — private</title>
<style>
  :root{
    --paper:#FAF6EF; --ink:#2A2622; --mute:#B6ADA0; --line:#EAE2D4;
    --accent:#C9923E;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:#d8d0c2;
    display:flex;align-items:center;justify-content:center}
  .phone{width:390px;height:844px;background:var(--paper);position:relative;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.32);display:flex;flex-direction:column}
  .status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:var(--ink)}
  .safe{position:absolute;top:62px;right:24px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .safe svg{stroke:var(--mute)}
  .find{position:absolute;top:62px;left:24px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .find svg{stroke:var(--mute)}
  .handle{position:absolute;top:64px;left:0;right:0;display:flex;justify-content:center}
  .handle div{width:38px;height:5px;border-radius:3px;background:var(--line)}

  .who{position:absolute;top:104px;left:0;right:0;display:flex;
    align-items:center;justify-content:center;gap:9px}
  .who span{font-size:14px;font-weight:600;color:var(--mute);letter-spacing:.04em}
  /* the eye is now CLOSED — the active masked state */
  .eye{margin-left:3px;width:26px;height:26px;border-radius:50%;background:#F2EEDF;
    display:flex;align-items:center;justify-content:center}
  .eye svg{stroke:var(--accent)}

  .scroll{flex:1;display:flex;flex-direction:column;padding:0 26px 36px}

  /* the layout is UNCHANGED — same hero, same rows. only the figures
     are masked. masked = a calm monospace block, never a number. */
  .mask{font-family:var(--mono);background:var(--line);color:transparent;
    border-radius:6px;letter-spacing:.1em;display:inline-block;
    user-select:none}

  /* margin-top clears the absolutely-positioned .who label (top:104 + ~30) */
  .hero{margin-top:116px;display:flex;flex-direction:column;align-items:center}
  .lead{font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.02em}
  .amount{margin-top:10px}
  .amount .mask{font-size:56px;padding:4px 16px;line-height:1;height:64px}
  .horizon{margin-top:26px;width:174px;height:4px;border-radius:3px;background:var(--line)}
  .til{margin-top:14px}
  .til .mask{font-size:13px;padding:3px 24px;height:19px}

  .spend{margin:30px auto 0;height:50px;border-radius:25px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;gap:8px;padding:0 26px;
    box-shadow:0 12px 28px rgba(201,146,62,.32)}
  .spend svg{stroke:#fff}
  .spend span{font-size:16px;font-weight:600;color:#fff}

  .rows{margin-top:54px;display:flex;flex-direction:column}
  .row{border-top:1px solid var(--line);padding:19px 2px;display:flex;
    align-items:center;gap:0}
  .row:last-child{border-bottom:1px solid var(--line)}
  .rk{font-size:13px;color:var(--mute);font-weight:600}
  .rsep{color:var(--line);margin:0 8px;font-size:13px}
  .row .mask{font-size:13px;padding:3px 0;height:19px;flex:1}
  .chev{stroke:var(--mute);margin-left:8px}

  /* a quiet face-id prompt at the bottom — the way back */
  .unlock{margin-top:auto;padding-top:30px;display:flex;flex-direction:column;
    align-items:center;gap:10px}
  .faceid{width:50px;height:50px;border-radius:14px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center}
  .faceid svg{stroke:var(--mute)}
  .unlock span{font-size:13px;color:var(--mute);font-weight:500}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
  <div class="handle"><div></div></div>
  <div class="find">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>
    </svg>
  </div>
  <div class="safe">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>
    </svg>
  </div>

  <div class="who">
    <span>money</span>
    <!-- eye closed — masked state active -->
    <div class="eye">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
        <path d="M2 12s3.5-7 10-7 10 7 10 7"/><path d="M3 4l18 16"/>
        <path d="M9.5 9.6A3 3 0 0 0 12 15a3 3 0 0 0 2.6-1.5"/>
      </svg>
    </div>
  </div>

  <div class="scroll">
    <div class="hero">
      <div class="lead">safe to spend</div>
      <div class="amount"><span class="mask">&nbsp;</span></div>
      <div class="horizon"></div>
      <div class="til"><span class="mask">&nbsp;</span></div>
      <div class="spend">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
        <span>spend</span>
      </div>
    </div>

    <div class="rows">
      <div class="row"><span class="rk">bills</span><span class="rsep">·</span>
        <span class="mask">&nbsp;</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="row"><span class="rk">income</span><span class="rsep">·</span>
        <span class="mask">&nbsp;</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="row"><span class="rk">subscriptions</span><span class="rsep">·</span>
        <span class="mask">&nbsp;</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="row"><span class="rk">savings</span><span class="rsep">·</span>
        <span class="mask">&nbsp;</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="row"><span class="rk">adhd tax</span><span class="rsep">·</span>
        <span class="mask">&nbsp;</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <div class="unlock">
      <div class="faceid">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/>
          <path d="M9 10v2M15 10v2M12 9v4M9.5 16a4 4 0 0 0 5 0"/>
        </svg>
      </div>
      <span>face id to show your figures</span>
    </div>
  </div>
</div>
</body>
</html>
