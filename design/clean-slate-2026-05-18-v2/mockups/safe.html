<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ollie · Safe</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#d8d0c2;
    display:flex;align-items:center;justify-content:center}
  .phone{width:390px;height:844px;position:relative;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.32);display:flex;flex-direction:column;
    background:linear-gradient(180deg,#3C4B47 0%,#2B3633 100%)}
  .status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:#EAE6DE}

  /* close = glyph */
  .x{position:absolute;top:60px;right:22px;width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(234,230,222,.18);display:flex;align-items:center;justify-content:center}
  .x svg{stroke:rgba(234,230,222,.6)}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 38px;gap:24px}

  /* one slow breathing orb — calm, wordless */
  .orb{width:120px;height:120px;border-radius:50%;margin-bottom:26px;
    background:radial-gradient(circle at 38% 34%,#7FA89D,#4E6B63);
    box-shadow:0 0 80px rgba(127,168,157,.4);
    animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(.86)}50%{transform:scale(1.1)}}

  /* two big targets — call · breathe. glyph-led. */
  .target{width:100%;height:96px;border-radius:24px;display:flex;align-items:center;
    padding:0 30px;gap:20px}
  .t-call{background:#EAE6DE}
  .t-breathe{background:rgba(234,230,222,.1);border:1px solid rgba(234,230,222,.2)}
  .ico{width:48px;height:48px;border-radius:50%;display:flex;
    align-items:center;justify-content:center;flex:none}
  .t-call .ico{background:#3C4B47}
  .t-call .ico svg{stroke:#EAE6DE}
  .t-breathe .ico{background:rgba(234,230,222,.14)}
  .t-breathe .ico svg{stroke:#EAE6DE}
  .lbl{font-size:21px;font-weight:500;letter-spacing:-.01em}
  .t-call .lbl{color:#2B3633}
  .t-breathe .lbl{color:#EAE6DE}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
  <div class="x">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </div>

  <div class="stage">
    <div class="orb"></div>
    <div class="target t-call">
      <div class="ico">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.8">
          <path d="M5 4h4l2 5-3 2a12 12 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>
        </svg>
      </div>
      <span class="lbl">Call</span>
    </div>
    <div class="target t-breathe">
      <div class="ico">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/>
        </svg>
      </div>
      <span class="lbl">Breathe</span>
    </div>
  </div>
</div>
</body>
</html>
