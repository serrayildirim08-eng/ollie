<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ollie · Subscriptions</title>
<style>
  :root{
    --paper:#FAF6EF; --ink:#2A2622; --mute:#B6ADA0; --line:#EAE2D4;
    --accent:#C9923E; --sage:#5B8C7E;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:#d8d0c2;
    display:flex;align-items:center;justify-content:center}
  .phone{width:390px;height:844px;background:var(--paper);position:relative;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.32);display:flex;flex-direction:column}
  .status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:var(--ink)}
  .safe{position:absolute;top:62px;right:24px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .safe svg{stroke:var(--mute)}
  .find{position:absolute;top:62px;left:24px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .find svg{stroke:var(--mute)}
  .handle{position:absolute;top:64px;left:0;right:0;display:flex;justify-content:center}
  .handle div{width:38px;height:5px;border-radius:3px;background:var(--line)}

  .who{position:absolute;top:96px;left:26px;display:flex;align-items:center;gap:10px}
  .who .g{width:34px;height:34px;border-radius:11px;background:#F2EEDF;
    display:flex;align-items:center;justify-content:center}
  .who .g svg{stroke:var(--accent)}
  .who span{font-size:14px;font-weight:600;color:var(--mute);letter-spacing:.04em}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 40px}

  /* THE ONE THING — the audit. ONE subscription at a time, never a list,
     never a wall of guilt. a calm observation, then your two choices.
     "1 of 2" dots count what's left; the tone never moralizes. */
  .lead{font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.02em;
    margin-bottom:30px}

  /* the one card — neutral, observational */
  .card{width:100%;background:#fff;border:1px solid var(--line);border-radius:26px;
    box-shadow:0 16px 38px rgba(42,38,34,.07);padding:32px 28px 30px;
    display:flex;flex-direction:column;align-items:center;text-align:center}
  .name{font-size:30px;font-weight:400;color:var(--ink);letter-spacing:-.02em}
  .price{margin-top:6px;font-size:14px;color:var(--mute);font-weight:500}
  /* the observation — sage, factual, the gentlest possible phrasing */
  .obs{margin-top:22px;font-size:15px;line-height:1.5;color:var(--sage);
    font-weight:500;letter-spacing:-.005em;max-width:240px}

  /* keep / cancel — two calm targets, equal weight, no nudge */
  .choices{margin-top:30px;display:flex;flex-direction:column;gap:10px;width:100%}
  .keep{height:52px;border-radius:26px;border:1px solid var(--line);background:var(--paper);
    display:flex;align-items:center;justify-content:center;font-size:16px;
    font-weight:600;color:var(--ink)}
  .cancel{height:52px;border-radius:26px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 12px 28px rgba(201,146,62,.3)}
  .cancel svg{stroke:#fff}
  .cancel span{font-size:16px;font-weight:600;color:#fff}

  /* progress through the audit — quiet dots, not pressure */
  .rest{margin-top:30px;display:flex;gap:9px}
  .rest i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
  .rest i.now{background:var(--ink)}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
  <div class="handle"><div></div></div>
  <div class="find">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>
    </svg>
  </div>
  <div class="safe">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>
    </svg>
  </div>

  <div class="who">
    <div class="g">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
        <path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/>
      </svg>
    </div>
    <span>subscriptions</span>
  </div>

  <div class="stage">
    <div class="lead">a quiet look · 1 of 2</div>
    <div class="card">
      <div class="name">Netflix</div>
      <div class="price">$15 / mo</div>
      <div class="obs">not in your words for 6 weeks. still paid each month.</div>
      <div class="choices">
        <div class="keep">keep it</div>
        <div class="cancel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg>
          <span>cancel — open netflix</span>
        </div>
      </div>
    </div>
    <div class="rest"><i class="now"></i><i></i></div>
  </div>
</div>
</body>
</html>
