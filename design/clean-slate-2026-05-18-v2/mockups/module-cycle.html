<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ollie · Cycle</title>
<style>
  :root{
    --paper:#FAF6EF; --ink:#2A2622; --mute:#B6ADA0; --line:#EAE2D4;
    --accent:#C9923E;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:#d8d0c2;
    display:flex;align-items:center;justify-content:center}
  .phone{width:390px;height:844px;background:var(--paper);position:relative;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.32);display:flex;flex-direction:column}
  .status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:var(--ink)}
  .safe{position:absolute;top:62px;right:24px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .safe svg{stroke:var(--mute)}
  .find{position:absolute;top:62px;left:24px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .find svg{stroke:var(--mute)}
  .handle{position:absolute;top:64px;left:0;right:0;display:flex;justify-content:center}
  .handle div{width:38px;height:5px;border-radius:3px;background:var(--line)}

  .who{position:absolute;top:96px;left:26px;display:flex;align-items:center;gap:10px}
  .who .g{width:34px;height:34px;border-radius:11px;background:#F2EEDF;
    display:flex;align-items:center;justify-content:center}
  .who .g svg{stroke:var(--accent)}
  .who span{font-size:14px;font-weight:600;color:var(--mute);letter-spacing:.04em}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 40px}

  /* THE ONE THING — where you are in the cycle, as a single travelling dot
     on a closed ring. no calendar grid, no day numbers, no log of symptoms.
     the ring is the cycle; the dot is today; the soft arc is the window. */
  .ringwrap{position:relative;width:248px;height:248px;display:flex;
    align-items:center;justify-content:center;flex-direction:column}
  svg.cyc{position:absolute}
  /* the today dot rides the ring at -58deg from top */
  .today{position:absolute;width:20px;height:20px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 6px var(--paper),0 6px 16px rgba(201,146,62,.4);
    /* placed via transform on the ring radius (r=104, center 124) */
    transform:translate(88px,-55px)}
  .phase{font-size:25px;font-weight:400;color:var(--ink);letter-spacing:-.012em}
  .next{margin-top:8px;font-size:14px;color:var(--mute);font-weight:500}

  /* one add target — log today */
  .add{margin-top:50px;width:76px;height:76px;border-radius:50%;
    background:var(--accent);display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 32px rgba(201,146,62,.34)}
  .add svg{stroke:#fff}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
  <div class="handle"><div></div></div>
  <div class="find">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>
    </svg>
  </div>
  <div class="safe">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>
    </svg>
  </div>

  <div class="who">
    <div class="g">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
        <path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/>
      </svg>
    </div>
    <span>cycle</span>
  </div>

  <div class="stage">
    <div class="ringwrap">
      <svg class="cyc" width="248" height="248" viewBox="0 0 248 248">
        <!-- full cycle ring -->
        <circle cx="124" cy="124" r="104" fill="none" stroke="#EAE2D4" stroke-width="8"/>
        <!-- soft fertile-window arc, the only emphasised stretch -->
        <circle cx="124" cy="124" r="104" fill="none" stroke="#C9923E" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="86 567" stroke-dashoffset="-300"
          opacity=".5" transform="rotate(-90 124 124)"/>
      </svg>
      <div class="today"></div>
      <div class="phase">day 14 · luteal</div>
      <div class="next">period in 12 days</div>
    </div>
    <div class="add">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
