<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ollie · Habits</title>
<style>
  :root{
    --paper:#FAF6EF; --ink:#2A2622; --mute:#B6ADA0; --line:#EAE2D4;
    --accent:#C9923E; --sage:#5B8C7E;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:#d8d0c2;
    display:flex;align-items:center;justify-content:center}
  .phone{width:390px;height:844px;background:var(--paper);position:relative;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.32);display:flex;flex-direction:column}
  .status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:var(--ink)}
  .safe{position:absolute;top:62px;right:24px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .safe svg{stroke:var(--mute)}
  .find{position:absolute;top:62px;left:24px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .find svg{stroke:var(--mute)}
  .handle{position:absolute;top:64px;left:0;right:0;display:flex;justify-content:center}
  .handle div{width:38px;height:5px;border-radius:3px;background:var(--line)}

  /* habits is a submodule reached by drilling the body page's habits card.
     the face: ONE focus = the SINGLE next check-in. no grid, no streak.
     centred .who label, v2. */
  .who{position:absolute;top:104px;left:0;right:0;display:flex;
    align-items:center;justify-content:center;gap:9px}
  .who span{font-size:14px;font-weight:600;color:var(--mute);letter-spacing:.04em}

  .scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;
    padding:0 26px 36px}

  /* THE HERO — the single next check-in. one big tap-circle, the habit
     name large, its cue under it. tap = done, the next slides in.
     margin-top clears the absolutely-positioned .who label. */
  .hero{margin-top:116px;display:flex;flex-direction:column;align-items:center}
  .lead{font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.02em}

  /* the tap-circle — the act of checking one habit in. soft, generous,
     a quiet ink check inside. tapping it fills the circle, then the
     next habit slides in. never a streak counter, never a number. */
  .tap{margin-top:30px;width:150px;height:150px;border-radius:50%;
    border:2px solid var(--line);background:#fff;display:flex;
    align-items:center;justify-content:center;
    box-shadow:0 16px 38px rgba(42,38,34,.07)}
  .tap svg{stroke:var(--accent)}

  /* the habit name — the user's own thing, large, the only big text */
  .name{margin-top:34px;font-size:30px;font-weight:400;color:var(--ink);
    letter-spacing:-.015em;line-height:1.1;text-align:center}
  /* the cue — the anchor the habit hangs from, quiet under the name */
  .cue{margin-top:9px;font-size:14px;color:var(--mute);font-weight:500;
    letter-spacing:.01em}
  .cue b{color:var(--ink);font-weight:600}

  /* the progress arc — body.html's habits gauge, scaled up. a ~270° open
     arc (deliberately NOT a closed ring), filled in ink for what's done,
     the rest a calm line track. a ledger of today, no streak, no grid.
     under it, a dot row counting what still waits. */
  .progress{margin-top:34px;display:flex;flex-direction:column;
    align-items:center;gap:14px}
  .gauge{position:relative;width:112px;height:112px}
  .gauge svg{display:block}
  .gauge .gtrack{stroke:var(--line);stroke-width:6;fill:none;
    stroke-linecap:round}
  .gauge .gfill{stroke:var(--ink);stroke-width:6;fill:none;
    stroke-linecap:round}
  /* the centre of the gauge — a calm "n done" count, never out of a total
     in a way that reads as a score. it's a ledger mark, not a grade. */
  .gcentre{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center}
  .gnum{font-size:34px;font-weight:300;color:var(--ink);letter-spacing:-.03em;
    line-height:1}
  .glbl{margin-top:3px;font-size:11px;color:var(--mute);font-weight:600;
    letter-spacing:.06em;text-transform:uppercase}

  /* the waiting-dot row — one quiet dot per habit still to do today.
     done = soft sage, this-one-now = ink, still-waiting = line.
     it counts what waits, never what was missed. */
  .rest{display:flex;gap:9px;align-items:center}
  .rest i{width:9px;height:9px;border-radius:50%;background:var(--line);
    display:block}
  .rest i.done{background:var(--sage)}
  .rest i.now{background:var(--ink)}
  .restlbl{margin-top:2px;font-size:13px;color:var(--mute);font-weight:500;
    letter-spacing:-.01em}

  /* one amber button — add a habit */
  .add{margin:32px auto 0;height:50px;border-radius:25px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;gap:8px;padding:0 24px;
    box-shadow:0 12px 28px rgba(201,146,62,.32)}
  .add svg{stroke:#fff}
  .add span{font-size:16px;font-weight:600;color:#fff;letter-spacing:-.01em}

  /* below the hero, with air — calm drill rows. each = one tailored line.
     tap a row → its screen. no chevron clutter, just a quiet caret. */
  .rows{margin-top:48px;display:flex;flex-direction:column}
  .row{border-top:1px solid var(--line);padding:18px 2px;display:flex;
    align-items:center}
  .row:last-child{border-bottom:1px solid var(--line)}
  .rk{font-size:13px;color:var(--mute);font-weight:600;letter-spacing:.01em;
    flex-shrink:0}
  .rsep{color:var(--line);margin:0 8px;font-size:13px}
  .rv{font-size:14px;color:var(--ink);font-weight:500;letter-spacing:-.01em;flex:1}
  .chev{stroke:var(--mute);flex-shrink:0;margin-left:8px}

  /* a pattern is live — ONE calm sage observation row.
     only ever shown when a pattern exists; routes to habits-patterns. */
  .row.obs .rdot{width:6px;height:6px;border-radius:50%;background:var(--sage);
    flex-shrink:0;margin-right:11px}
  .row.obs .rv{color:var(--ink)}
  .row.obs .rk{color:var(--sage)}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
  <div class="handle"><div></div></div>
  <div class="find">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>
    </svg>
  </div>
  <div class="safe">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>
    </svg>
  </div>

  <div class="who">
    <span>habits</span>
  </div>

  <div class="scroll">
    <div class="hero">
      <div class="lead">next, when you can</div>

      <!-- the one tap-circle — checking this habit in -->
      <div class="tap">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke-width="2.1">
          <path d="M5 13l4 4 10-11"/>
        </svg>
      </div>

      <!-- the habit, large — and its cue, the anchor it hangs from -->
      <div class="name">drink water</div>
      <div class="cue">after <b>coffee</b></div>

      <!-- the progress — body.html's habits gauge scaled up: a 270° open
           arc, NOT a closed ring. filled 2/6 in ink. centre = a calm
           ledger count, never a score. -->
      <div class="progress">
        <div class="gauge">
          <svg width="112" height="112" viewBox="0 0 112 112">
            <!-- the gauge opens at the bottom: a 270° arc, gap centred
                 downward. r=46, circumference≈289.0; 270° ≈ 216.8.
                 start the arc at 135° (bottom-left), sweep clockwise. -->
            <circle class="gtrack" cx="56" cy="56" r="46"
              stroke-dasharray="216.8 72.2"
              transform="rotate(135 56 56)"/>
            <!-- fill 2 of 6 → one-third of the 270° arc → 72.3 of 216.8 -->
            <circle class="gfill" cx="56" cy="56" r="46"
              stroke-dasharray="72.3 216.7"
              transform="rotate(135 56 56)"/>
          </svg>
          <div class="gcentre">
            <div class="gnum">2</div>
            <div class="glbl">done today</div>
          </div>
        </div>

        <!-- the waiting row — one dot per habit. 2 done (sage), this one
             now (ink), 3 still waiting (line). counts what waits. -->
        <div class="rest">
          <i class="done"></i><i class="done"></i>
          <i class="now"></i>
          <i></i><i></i><i></i>
        </div>
        <div class="restlbl">3 still waiting · no rush</div>
      </div>

      <div class="add">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.4">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>add a habit</span>
      </div>
    </div>

    <div class="rows">
      <!-- all habits -->
      <div class="row">
        <span class="rk">all habits</span><span class="rsep">·</span>
        <span class="rv">6 on file · morning to evening</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </div>

      <!-- a pattern is live — ONE calm sage observation row.
           only ever shown when a pattern exists; routes to habits-patterns. -->
      <div class="row obs">
        <span class="rdot"></span>
        <span class="rk">see the rest</span><span class="rsep">·</span>
        <span class="rv">a few things ollie noticed about your habits</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>
</div>
</body>
</html>
