<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ollie · Savings</title>
<style>
  :root{
    --paper:#FAF6EF; --ink:#2A2622; --mute:#B6ADA0; --line:#EAE2D4;
    --accent:#C9923E;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:#d8d0c2;
    display:flex;align-items:center;justify-content:center}
  .phone{width:390px;height:844px;background:var(--paper);position:relative;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.32);display:flex;flex-direction:column}
  .status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:var(--ink)}
  .safe{position:absolute;top:62px;right:24px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .safe svg{stroke:var(--mute)}
  .find{position:absolute;top:62px;left:24px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .find svg{stroke:var(--mute)}
  .handle{position:absolute;top:64px;left:0;right:0;display:flex;justify-content:center}
  .handle div{width:38px;height:5px;border-radius:3px;background:var(--line)}

  .who{position:absolute;top:96px;left:26px;display:flex;align-items:center;gap:10px}
  .who .g{width:34px;height:34px;border-radius:11px;background:#F2EEDF;
    display:flex;align-items:center;justify-content:center}
  .who .g svg{stroke:var(--accent)}
  .who span{font-size:14px;font-weight:600;color:var(--mute);letter-spacing:.04em}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 44px}

  /* THE ONE THING — one saved-toward thing. the amount on a soft
     horizon line, same horizon grammar as safe-to-spend. no charts. */
  .lead{font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.02em}
  .goal{margin-top:6px;font-size:25px;font-weight:400;color:var(--ink);
    letter-spacing:-.015em}
  .amount{margin-top:24px;font-size:72px;font-weight:300;color:var(--ink);
    letter-spacing:-.04em;line-height:1}
  .amount .c{color:var(--mute);font-weight:300}
  /* the target, set quietly under the big number */
  .of{margin-top:8px;font-size:14px;color:var(--mute);font-weight:500}
  /* the soft horizon line — how far along, no percentage shouted */
  .horizon{margin-top:30px;width:200px;height:5px;border-radius:3px;
    background:var(--line);position:relative;overflow:hidden}
  .horizon div{position:absolute;left:0;top:0;bottom:0;width:34%;
    border-radius:3px;background:var(--accent)}
  .pace{margin-top:13px;font-size:13px;color:var(--mute);font-weight:500}

  /* one add target — add to savings */
  .add{margin-top:48px;height:52px;border-radius:26px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;gap:8px;padding:0 28px;
    box-shadow:0 12px 28px rgba(201,146,62,.32)}
  .add svg{stroke:#fff}
  .add span{font-size:16px;font-weight:600;color:#fff;letter-spacing:-.01em}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
  <div class="handle"><div></div></div>
  <div class="find">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>
    </svg>
  </div>
  <div class="safe">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>
    </svg>
  </div>

  <div class="who">
    <div class="g">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
        <path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5L12 21l-5-2.1 1-5.5-4-3.9 5.5-.8z"/>
      </svg>
    </div>
    <span>savings</span>
  </div>

  <div class="stage">
    <div class="lead">saving toward</div>
    <div class="goal">a trip</div>
    <div class="amount"><span class="c">$</span>340</div>
    <div class="of">of $1,000</div>
    <div class="horizon"><div></div></div>
    <div class="pace">~$55 a month · on track for october</div>
    <div class="add">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2.4">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      <span>add to savings</span>
    </div>
  </div>
</div>
</body>
</html>
