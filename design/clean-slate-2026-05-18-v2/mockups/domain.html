<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ollie · Domain</title>
<style>
  :root{
    --paper:#FAF6EF; --ink:#2A2622; --mute:#B6ADA0; --line:#EAE2D4;
    --body:#5B8C7E;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:#d8d0c2;
    display:flex;align-items:center;justify-content:center}
  .phone{width:390px;height:844px;background:var(--paper);position:relative;
    overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.32);display:flex;flex-direction:column}
  .status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:var(--ink)}

  /* back = swipe-down handle, a glyph not a word */
  .handle{position:absolute;top:64px;left:0;right:0;display:flex;justify-content:center}
  .handle div{width:38px;height:5px;border-radius:3px;background:var(--line)}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:0 40px}

  /* one ring with one number — the only number anywhere in the app */
  .ringwrap{position:relative;width:230px;height:230px;display:flex;
    align-items:center;justify-content:center}
  svg.prog{position:absolute;transform:rotate(-90deg)}
  .num{font-size:64px;font-weight:300;color:var(--ink);letter-spacing:-.03em}
  .domicon{position:absolute;bottom:-2px;display:flex}
  .domicon svg{stroke:var(--body)}

  /* one add target */
  .add{margin-top:56px;width:76px;height:76px;border-radius:50%;
    background:var(--body);display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 32px rgba(91,140,126,.34)}
  .add svg{stroke:#fff}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
  <div class="handle"><div></div></div>

  <div class="stage">
    <div class="ringwrap">
      <svg class="prog" width="230" height="230" viewBox="0 0 230 230">
        <circle cx="115" cy="115" r="104" fill="none" stroke="#EAE2D4" stroke-width="10"/>
        <circle cx="115" cy="115" r="104" fill="none" stroke="#5B8C7E" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="653" stroke-dashoffset="245"/>
      </svg>
      <div class="num">5</div>
      <div class="domicon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.7">
          <path d="M12 21c-1-6-7-7-7-12a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5-6 6-7 12z"/>
        </svg>
      </div>
    </div>
    <div class="add">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
