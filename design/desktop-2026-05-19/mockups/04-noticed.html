<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ollie desktop · noticed</title>
<style>
  :root{
    --paper:#FAF6EF; --card:#FFFFFF; --tile:#F2EEDF;
    --ink:#2A2622; --mute:#B6ADA0; --line:#EAE2D4;
    --accent:#C9923E; --sage:#5B8C7E; --umber:#A8703C;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{background:var(--paper);font-family:var(--sans);color:var(--ink);
    -webkit-font-smoothing:antialiased;}
  .app{display:flex;width:100vw;height:100dvh;}

  /* ─── THIN SPINE ─── */
  .spine{width:clamp(60px,4.6vw,92px);height:100%;background:var(--tile);
    border-right:1px solid var(--line);flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(26px,2.2vw,40px) 0 clamp(22px,1.8vw,34px);}
  .mark{font-family:var(--sans);font-size:clamp(20px,1.7vw,30px);
    font-weight:400;color:var(--ink);line-height:1;}
  .glyphs{margin-top:clamp(74px,6vw,108px);display:flex;
    flex-direction:column;align-items:center;gap:clamp(34px,2.8vw,50px);}
  .glyph{width:clamp(24px,2vw,34px);height:clamp(24px,2vw,34px);
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .glyph svg{display:block;width:clamp(18px,1.5vw,26px);
    height:clamp(18px,1.5vw,26px);}
  .spine-foot{margin-top:auto;display:flex;flex-direction:column;
    align-items:center;gap:clamp(18px,1.5vw,28px);}
  .kbd{font-family:var(--mono);font-size:clamp(9px,0.75vw,13px);
    color:var(--mute);letter-spacing:.04em;}

  /* ─── CANVAS ─── */
  .canvas{flex:1;height:100%;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    padding:clamp(40px,5vw,110px);}
  .measure{width:clamp(600px,46vw,900px);}
  .eyebrow{font-family:var(--mono);font-size:clamp(10px,0.85vw,14px);
    letter-spacing:.22em;text-transform:uppercase;color:var(--mute);
    margin-bottom:clamp(56px,4.6vw,88px);}
  .pattern{margin-bottom:clamp(54px,4.4vw,84px);}
  .pattern:last-child{margin-bottom:0;}
  .pattern-line{font-family:var(--sans);font-size:clamp(25px,2vw,38px);
    font-weight:300;line-height:1.4;letter-spacing:-.015em;color:var(--ink);}
  .pattern-line em{font-style:normal;color:var(--accent);}
  .pattern-meta{font-family:var(--mono);font-size:clamp(10px,0.85vw,14px);
    letter-spacing:.06em;color:var(--mute);margin-top:clamp(14px,1.2vw,22px);}
</style>
</head>
<body>
<div class="app">

  <!-- THIN SPINE -->
  <aside class="spine">
    <div class="mark">o</div>
    <nav class="glyphs">
      <div class="glyph" title="throw">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
          stroke="#B6ADA0" stroke-width="1.5">
          <circle cx="9" cy="9" r="5"/>
        </svg>
      </div>
      <div class="glyph" title="modules">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
          stroke="#B6ADA0" stroke-width="1.5">
          <circle cx="5" cy="5" r="2.4"/><circle cx="13" cy="5" r="2.4"/>
          <circle cx="5" cy="13" r="2.4"/><circle cx="13" cy="13" r="2.4"/>
        </svg>
      </div>
      <div class="glyph" title="noticed">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M2 12c2.5-6 4.5-6 7-3s4.5 3 7-3" stroke="#C9923E"
            stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="glyph" title="find  ⌘K">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
          stroke="#B6ADA0" stroke-width="1.5" stroke-linecap="round">
          <circle cx="8" cy="8" r="5"/><path d="M15 15l-3.5-3.5"/>
        </svg>
      </div>
    </nav>
    <div class="spine-foot">
      <div class="glyph" title="safe">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
          stroke="#B6ADA0" stroke-width="1.5" stroke-linejoin="round">
          <path d="M9 2l5 2v5c0 4-5 7-5 7s-5-3-5-7V4z"/>
        </svg>
      </div>
      <div class="kbd">⌘K</div>
    </div>
  </aside>

  <!-- CANVAS -->
  <main class="canvas">
    <div class="measure">
      <div class="eyebrow">noticed</div>

      <div class="pattern">
        <div class="pattern-line">your spending climbs the
          <em>week before your period</em>.</div>
        <div class="pattern-meta">money · cycle</div>
      </div>

      <div class="pattern">
        <div class="pattern-line">you sleep better on the nights you
          <em>walk mira</em>.</div>
        <div class="pattern-meta">sleep · pets</div>
      </div>

      <div class="pattern">
        <div class="pattern-line">admin tasks sit longest when
          <em>work gets busy</em>.</div>
        <div class="pattern-meta">admin · work</div>
      </div>
    </div>
  </main>

</div>
</body>
</html>
