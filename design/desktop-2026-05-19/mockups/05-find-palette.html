<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ollie desktop · find</title>
<style>
  :root{
    --paper:#FAF6EF; --card:#FFFFFF; --tile:#F2EEDF;
    --ink:#2A2622; --mute:#B6ADA0; --line:#EAE2D4;
    --accent:#C9923E; --sage:#5B8C7E; --umber:#A8703C;
    --sans:-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{background:var(--paper);font-family:var(--sans);color:var(--ink);
    -webkit-font-smoothing:antialiased;}
  .app{display:flex;width:100vw;height:100dvh;}

  /* ─── THIN SPINE (stays sharp, above scrim) ─── */
  .spine{width:clamp(60px,4.6vw,92px);height:100%;background:var(--tile);
    border-right:1px solid var(--line);flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(26px,2.2vw,40px) 0 clamp(22px,1.8vw,34px);
    position:relative;z-index:300;}
  .mark{font-family:var(--sans);font-size:clamp(20px,1.7vw,30px);
    font-weight:400;color:var(--ink);line-height:1;}
  .glyphs{margin-top:clamp(74px,6vw,108px);display:flex;
    flex-direction:column;align-items:center;gap:clamp(34px,2.8vw,50px);}
  .glyph{width:clamp(24px,2vw,34px);height:clamp(24px,2vw,34px);
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .glyph svg{display:block;width:clamp(18px,1.5vw,26px);
    height:clamp(18px,1.5vw,26px);}
  .spine-foot{margin-top:auto;display:flex;flex-direction:column;
    align-items:center;gap:clamp(18px,1.5vw,28px);}
  .kbd{font-family:var(--mono);font-size:clamp(9px,0.75vw,13px);
    color:var(--mute);letter-spacing:.04em;}

  /* ─── DIMMED CANVAS BEHIND ─── */
  .canvas{flex:1;height:100%;background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    padding:clamp(40px,5vw,110px);filter:blur(2px);}
  .measure{width:clamp(600px,46vw,900px);display:flex;
    flex-direction:column;align-items:center;text-align:center;}
  .prompt{font-family:var(--sans);font-size:clamp(34px,3.2vw,60px);
    font-weight:300;letter-spacing:-.02em;color:var(--ink);
    margin-bottom:clamp(40px,3.4vw,64px);}
  .capture{width:100%;min-height:clamp(152px,14vw,232px);
    background:var(--card);border:1px solid var(--line);}

  /* ─── SCRIM ─── */
  .scrim{position:absolute;top:0;left:clamp(60px,4.6vw,92px);
    right:0;bottom:0;background:rgba(42,38,34,.26);z-index:200;
    display:flex;flex-direction:column;align-items:center;
    padding-top:clamp(150px,13vw,260px);}

  /* ─── ⌘K PALETTE ─── */
  .palette{width:clamp(560px,42vw,760px);background:var(--card);
    border-radius:12px;box-shadow:0 16px 38px rgba(42,38,34,.10);
    overflow:hidden;}
  .pal-field{display:flex;align-items:center;gap:clamp(14px,1.1vw,20px);
    padding:clamp(22px,1.7vw,32px) clamp(24px,1.9vw,36px);
    border-bottom:1px solid var(--line);}
  .pal-field svg{flex-shrink:0;width:clamp(18px,1.4vw,24px);
    height:clamp(18px,1.4vw,24px);}
  .pal-input{font-family:var(--sans);font-size:clamp(19px,1.5vw,28px);
    font-weight:300;color:var(--ink);flex:1;}
  .pal-input .caret{display:inline-block;width:1.5px;height:1.05em;
    background:var(--accent);vertical-align:-.16em;
    animation:blink 1.1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  .pal-esc{font-family:var(--mono);font-size:clamp(10px,0.8vw,14px);
    color:var(--mute);letter-spacing:.04em;}

  .pal-section{font-family:var(--mono);font-size:clamp(9px,0.72vw,13px);
    letter-spacing:.20em;text-transform:uppercase;color:var(--mute);
    padding:clamp(18px,1.4vw,26px) clamp(24px,1.9vw,36px) clamp(6px,0.5vw,10px);}
  .pal-row{display:flex;align-items:baseline;gap:clamp(14px,1.1vw,20px);
    padding:clamp(11px,0.9vw,17px) clamp(24px,1.9vw,36px);cursor:pointer;}
  .pal-row.sel{background:var(--tile);}
  .pal-glyph{font-family:var(--mono);font-size:clamp(11px,0.9vw,15px);
    color:var(--mute);width:clamp(10px,0.8vw,14px);flex-shrink:0;}
  .pal-label{font-family:var(--sans);font-size:clamp(15px,1.2vw,22px);
    font-weight:300;color:var(--ink);flex:1;}
  .pal-label em{font-style:normal;color:var(--accent);}
  .pal-crumb{font-family:var(--mono);font-size:clamp(10px,0.8vw,14px);
    letter-spacing:.06em;color:var(--mute);}
  .pal-foot{padding:clamp(14px,1.1vw,20px) clamp(24px,1.9vw,36px);
    border-top:1px solid var(--line);display:flex;gap:clamp(22px,1.8vw,34px);}
  .foot-hint{font-family:var(--mono);font-size:clamp(10px,0.8vw,14px);
    letter-spacing:.04em;color:var(--mute);}
</style>
</head>
<body>
<div class="app">

  <!-- THIN SPINE -->
  <aside class="spine">
    <div class="mark">o</div>
    <nav class="glyphs">
      <div class="glyph" title="throw">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="5" fill="#C9923E"/>
        </svg>
      </div>
      <div class="glyph" title="modules">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
          stroke="#B6ADA0" stroke-width="1.5">
          <circle cx="5" cy="5" r="2.4"/><circle cx="13" cy="5" r="2.4"/>
          <circle cx="5" cy="13" r="2.4"/><circle cx="13" cy="13" r="2.4"/>
        </svg>
      </div>
      <div class="glyph" title="noticed">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
          stroke="#B6ADA0" stroke-width="1.5" stroke-linecap="round">
          <path d="M2 12c2.5-6 4.5-6 7-3s4.5 3 7-3"/>
        </svg>
      </div>
      <div class="glyph" title="find  ⌘K">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="8" cy="8" r="5" stroke="#C9923E" stroke-width="1.8"/>
          <path d="M15 15l-3.5-3.5" stroke="#C9923E" stroke-width="1.8"
            stroke-linecap="round"/>
        </svg>
      </div>
    </nav>
    <div class="spine-foot">
      <div class="glyph" title="safe">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
          stroke="#B6ADA0" stroke-width="1.5" stroke-linejoin="round">
          <path d="M9 2l5 2v5c0 4-5 7-5 7s-5-3-5-7V4z"/>
        </svg>
      </div>
      <div class="kbd">⌘K</div>
    </div>
  </aside>

  <!-- DIMMED HOME -->
  <main class="canvas">
    <div class="measure">
      <h1 class="prompt">what's in your head?</h1>
      <div class="capture"></div>
    </div>
  </main>

</div>

<!-- SCRIM + PALETTE -->
<div class="scrim">
  <div class="palette">
    <div class="pal-field">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
        stroke="#B6ADA0" stroke-width="1.6" stroke-linecap="round">
        <circle cx="8" cy="8" r="5.5"/><path d="M16 16l-4-4"/>
      </svg>
      <div class="pal-input">pass<span class="caret"></span></div>
      <span class="pal-esc">esc</span>
    </div>

    <div class="pal-section">thrown thoughts</div>
    <div class="pal-row sel">
      <span class="pal-glyph">›</span>
      <span class="pal-label">renew <em>pass</em>port — window closes soon</span>
      <span class="pal-crumb">3h ago</span>
    </div>
    <div class="pal-row">
      <span class="pal-glyph">›</span>
      <span class="pal-label">find the <em>pass</em>word for the old account</span>
      <span class="pal-crumb">yesterday</span>
    </div>

    <div class="pal-section">where it lives</div>
    <div class="pal-row">
      <span class="pal-glyph">›</span>
      <span class="pal-label"><em>pass</em>port renewal</span>
      <span class="pal-crumb">admin</span>
    </div>
    <div class="pal-row">
      <span class="pal-glyph">›</span>
      <span class="pal-label">app lock &amp; <em>pass</em>phrase</span>
      <span class="pal-crumb">settings</span>
    </div>

    <div class="pal-foot">
      <span class="foot-hint">↑↓ move</span>
      <span class="foot-hint">↵ open</span>
      <span class="foot-hint">esc close</span>
    </div>
  </div>
</div>

</body>
</html>
