<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ollie · Catch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7F0; --ink:#2A2622; --mute:#7C736B; --line:#E9E1D4;
    --amber:#E8732C; --sage:#5B8C7E;
    --serif:'Newsreader',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--sans);background:#d8d0c2;display:flex;
    align-items:center;justify-content:center}
  .phone{
    width:390px;height:844px;background:var(--paper);position:relative;
    overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.32);
  }
  .status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:var(--ink)}
  .status .dots{display:flex;gap:5px}

  .top{display:flex;align-items:center;justify-content:space-between;padding:8px 24px 0}
  .close{font-size:15px;color:var(--mute)}
  .top .mode{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

  .body{flex:1;padding:0 28px;display:flex;flex-direction:column}
  .field{margin-top:46px}
  .field .typed{font-family:var(--serif);font-size:25px;line-height:1.4;color:var(--ink)}
  .field .caret{display:inline-block;width:2px;height:26px;background:var(--amber);
    vertical-align:-5px;margin-left:1px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .hint{font-size:14px;color:var(--mute);margin-top:14px;line-height:1.5}

  /* live routing preview */
  .routing{margin-top:30px}
  .routing-lbl{font-size:12px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--mute);margin-bottom:12px}
  .route{display:flex;align-items:center;gap:11px;background:#F2EEDF;
    border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px}
  .route .dot{width:9px;height:9px;border-radius:3px;flex:none}
  .route .name{font-size:14px;font-weight:600;color:var(--ink)}
  .route .det{font-size:13px;color:var(--mute);margin-left:auto}

  /* voice region */
  .voice{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;padding-bottom:38px}
  .ring{position:relative;width:118px;height:118px;display:flex;
    align-items:center;justify-content:center;margin-bottom:18px}
  .ring::before,.ring::after{content:"";position:absolute;border-radius:50%;
    border:2px solid rgba(232,115,44,.35)}
  .ring::before{inset:0;animation:breathe 4s ease-in-out infinite}
  .ring::after{inset:14px;animation:breathe 4s ease-in-out infinite .6s}
  @keyframes breathe{0%,100%{transform:scale(.86);opacity:.5}
    50%{transform:scale(1.04);opacity:1}}
  .mic{width:74px;height:74px;border-radius:50%;background:var(--amber);
    display:flex;align-items:center;justify-content:center;font-size:29px;
    color:#fff;box-shadow:0 8px 26px rgba(232,115,44,.5);z-index:1}
  .listening{font-size:14px;color:var(--mute);letter-spacing:.02em}
  .listening b{color:var(--ink);font-weight:600}

  .or{display:flex;align-items:center;gap:14px;margin:8px 0 28px;
    color:var(--mute);font-size:12px;letter-spacing:.06em}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span class="dots">􀙇 􀛨 􀋲</span></div>

  <div class="top">
    <span class="close">✕  back</span>
    <span class="mode">catching</span>
  </div>

  <div class="body">
    <div class="field">
      <div class="typed">netflix charged me again, i really thought i cancelled<span class="caret"></span></div>
      <div class="hint">just say it however it comes out. don't sort it, don't spell it right — i'll sort it.</div>
    </div>

    <div class="routing">
      <div class="routing-lbl">i think this goes to</div>
      <div class="route">
        <div class="dot" style="background:#C9923E"></div>
        <div class="name">finance</div>
        <div class="det">→ a subscription</div>
      </div>
    </div>

    <div class="voice">
      <div class="or">or speak it</div>
      <div class="ring"><div class="mic">􀊱</div></div>
      <div class="listening"><b>listening</b> · take your time</div>
    </div>
  </div>
</div>
</body>
</html>
