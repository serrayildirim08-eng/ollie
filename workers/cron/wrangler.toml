name = "ollie-cron"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Schedules:
#   - 03:00 UTC nightly  — daily intelligence layer (stubs today)
#   - every 5 minutes    — drains TWO queues on the same tick:
#                            (1) brain-dump enrichment queue (KV → Anthropic)
#                            (2) notification delivery queue
#                                (scheduled_jobs → APNs) — flushNotificationQueue.
#                          5 min is the delivery latency for server-side
#                          notifications; time-sensitive pushes also have a
#                          client-side fallback timer.
#
# Sunday 19:00 UTC weekly review is intentionally NOT in the crons list.
# Server-cron path deferred; primary = client-side scheduleWeeklyReview().
# When ready, add: "0 19 * * 0"
[triggers]
crons = ["0 3 * * *", "*/5 * * * *"]
# crons = ["0 3 * * *", "*/5 * * * *", "0 19 * * 0"]  # uncomment to enable weekly-review server cron

# ─── KV binding ────────────────────────────────────────────────────────────────
# Re-use the ai-proxy CACHE_KV namespace so /enrich-dump and the drain handler
# share one storage. Replace the id with the same id used in
# workers/ai-proxy/wrangler.toml.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "6031aea7f9c14f96884e55ec1be527f3"

# ─── service binding to the APNs Worker ────────────────────────────────────────
# Cron calls APNs via service binding (in-cluster, no public hop, no rate-limit
# on egress). Deploy ollie-apns-push first so this binding resolves.
[[services]]
binding = "APNS_PUSH"
service = "ollie-apns-push"

# ─── service binding to ai-proxy ───────────────────────────────────────────────
# Cron calls ai-proxy via service binding (in-cluster, bypasses public DNS).
# Public worker-to-worker over .workers.dev URLs gets 1042 / 404 errors.
[[services]]
binding = "AI_PROXY"
service = "ollie-ai-proxy"

# ─── Cloudflare Queues consumer (item #4) — COMMENTED OUT, see DEPLOY_TODO ──────
# This worker consumes the brain-dump enrichment queue. The block is left
# commented: an uncommented consumer binding pointing at a queue that does
# not exist makes `wrangler deploy` FAIL. Until the queue is provisioned the
# 5-min `scheduled()` enrich-drain (KV-scan) keeps running unchanged.
#
# To enable (see DEPLOY_TODO.md §"Item #4 — Cloudflare Queues"):
#   1. wrangler queues create ollie-enrich-queue   (if not already done)
#   2. wrangler queues create ollie-enrich-dlq
#   3. uncomment the block below, AND the [[queues.producers]] block in
#      workers/ai-proxy/wrangler.toml
#   4. deploy ai-proxy, then cron
#
[[queues.consumers]]
queue = "ollie-enrich-queue"
max_batch_size = 25
max_batch_timeout = 30
max_retries = 12
dead_letter_queue = "ollie-enrich-dlq"

# ─── secrets (set with `wrangler secret put`) ──────────────────────────────────
# SUPABASE_URL                — https://<ref>.supabase.co
# SUPABASE_SERVICE_ROLE       — server-only key, NEVER in client env.
#                               Used by BOTH the enrich drain and the
#                               notification delivery drain (flushNotificationQueue):
#                               it scans scheduled_jobs + push_tokens across
#                               all users, bypassing RLS.
# SUPABASE_SERVICE_ROLE_KEY   — alias kept for the daily-stub handlers
# APNS_INTERNAL_SECRET        — shared secret presented to the apns-push
#                               worker's /push endpoint. MUST equal the
#                               value set on ollie-apns-push as
#                               APNS_INTERNAL_SECRET. Without it the
#                               notification drain gets 401 from /push.
#
# Note: ANTHROPIC_API_KEY is NOT needed here — the drain handler routes through
# ai-proxy/v1/messages which holds the Anthropic key. One key to rotate.
# The notification drain delivers via the APNS_PUSH service binding (above),
# so no Apple secrets are needed on this worker either.
