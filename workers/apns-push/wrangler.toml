name = "ollie-apns-push"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── KV bindings ───────────────────────────────────────────────────────────────
# Run once: `wrangler kv:namespace create RATE_KV`
# Then paste the returned id below (and remove the placeholder).
[[kv_namespaces]]
binding = "RATE_KV"
id = "04527c1767e0474d90aa52d1cd8f9c86"

# ─── native rate limiting (atomic, preferred over RATE_KV) ─────────────────────
# `limit()` is atomic at the edge, fixing the read-then-write race the KV
# counter has under burst. The native binding only supports a 10s or 60s
# `period`; the per-user ceiling is expressed as 50 req / 10s (≈ 5 req/sec).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "3001"
simple = { limit = 50, period = 10 }

# ─── secrets (set with `wrangler secret put`) ──────────────────────────────────
# APPLE_AUTH_KEY    — full p8 PEM contents
# APPLE_KEY_ID      — 10-char Apple Key ID
# APPLE_TEAM_ID     — 10-char Apple Team ID
# APPLE_BUNDLE_ID   — app.ollie.ollie
# APNS_INTERNAL_SECRET — shared secret callers must send as
#                   `Authorization: Bearer <secret>`. MUST equal cron's
#                   APNS_INTERNAL_SECRET. /push fails CLOSED (401) without it.
