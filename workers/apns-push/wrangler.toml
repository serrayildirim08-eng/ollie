name = "ollie-apns-push"
main = "src/index.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── KV bindings ───────────────────────────────────────────────────────────────
# RATE_KV is the LEGACY rate-limit store, kept as a fallback while the native
# Rate Limiting binding (below) rolls out. Safe to remove once the native
# limiter is confirmed live.
[[kv_namespaces]]
binding = "RATE_KV"
id = "04527c1767e0474d90aa52d1cd8f9c86"

# ─── native Rate Limiting binding (item #5) ────────────────────────────────────
# Replaces the racy KV-counter limiter. DECLARATIVE — provisioned automatically
# on `wrangler deploy`, no CLI resource step (needs Wrangler ≥ 4.36).
# `period` must be 10 or 60. The old limit was 5 req/sec → 50 requests / 10s.
[[ratelimits]]
name = "PUSH_RATE_LIMITER"
namespace_id = "2003"
simple = { limit = 50, period = 10 }

# ─── secrets (set with `wrangler secret put`) ──────────────────────────────────
# APPLE_AUTH_KEY        — full p8 PEM contents
# APPLE_KEY_ID          — 10-char Apple Key ID
# APPLE_TEAM_ID         — 10-char Apple Team ID
# APPLE_BUNDLE_ID       — app.ollie.ollie
# APNS_INTERNAL_SECRET  — shared secret for the internal /push endpoint.
#                         Generate once (openssl rand -hex 32) and set the
#                         SAME value on ollie-cron's APNS_INTERNAL_SECRET.
#                         Without it /push rejects every request (401).
