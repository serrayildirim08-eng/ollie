name: native
options:
  bundleIdPrefix: com.ollie.app
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Ollie
      PRODUCT_BUNDLE_IDENTIFIER: app.ollie.ollie
      DEVELOPMENT_TEAM: LA5J9BSPKL
    configs:
      # debug = automatic development signing so `tauri ios dev` can sideload
      # directly onto a registered device (dev profile has get-task-allow=true).
      debug:
        CODE_SIGN_STYLE: Automatic
      # release = manual App Store distribution signing for the TestFlight build
      # (unchanged — keeps docs/RELEASE.md recipe intact).
      release:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: Ollie iOS App Store
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  native_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
        buildPhase: none
      - path: native_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: native_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        # Allow the WKWebView to load the cleartext-HTTP dev server over the LAN
        # during `tauri ios dev` (e.g. http://192.168.1.x:1420). Without this,
        # iOS App Transport Security blocks the load → blank white screen.
        # NSAllowsLocalNetworking covers private ranges (10/8, 172.16/12,
        # 192.168/16) only — release builds load bundled assets, not HTTP, so
        # this is App-Store-friendly (NOT NSAllowsArbitraryLoads).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # WKWebView (the app's embedded browser) needs its OWN exception to
          # load the cleartext-HTTP dev server — NSAllowsLocalNetworking alone
          # is not honored for web-view content loads. This key permits insecure
          # loads ONLY inside web views, not the rest of the app. Dev-only effect
          # (release loads bundled assets, never HTTP).
          NSAllowsArbitraryLoadsInWebContent: true
        # ollie:// custom URL scheme (A2 deep links). iOS registers schemes via
        # Info.plist (the deep-link plugin's mobile config is for universal
        # links only); xcodegen keeps this across regenerations.
        CFBundleURLTypes:
          - CFBundleURLName: app.ollie.ollie
            CFBundleURLSchemes:
              - ollie
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.1.0
        CFBundleVersion: "1.1.0"
    entitlements:
      path: native_iOS/native_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a