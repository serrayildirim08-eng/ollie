[package]
name = "native"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-localhost = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Apple-only: typed bindings to UNUserNotificationCenter for OS-level local
# notifications that survive the app being quit (macOS 10.14+ and iOS).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSArray",
    "NSBundle",
    "NSDate",
    "NSError",
    "NSPredicate",
    "NSSet",
    "NSDictionary",
    "NSEnumerator",
    "NSFileManager",
    "NSURL",
    "NSData",
    # Apple Reminders need a due-date as date *components* (year/month/day/hour/
    # minute) rather than an absolute NSDate; NSCalendar builds those from a date.
    "NSCalendar",
] }
# Apple-only: typed bindings to EventKit (EKEventStore) for two-way Calendar
# read/write — the de-risking foundation for the "Schedule" feature.
objc2-event-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "EKEventStore",
    "EKEvent",
    # EKReminder (Apple Reminders / to-dos) + EKAlarm (event & reminder alerts).
    "EKReminder",
    "EKAlarm",
    "EKCalendarItem",
    "EKCalendar",
    "EKObject",
    "EKTypes",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationTrigger",
    "UNNotificationSound",
    "UNUserNotificationCenter",
    # A3: custom action buttons on macOS via native categories + delegate.
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationResponse",
    "UNNotification",
] }
block2 = "0.6"

