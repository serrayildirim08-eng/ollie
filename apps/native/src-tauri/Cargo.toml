[package]
name = "native"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` is NOT forced on here (audit M9): Tauri already enables the
# WebKit inspector automatically in debug builds, and listing the feature would
# also ship it in release binaries (an info-disclosure surface on a device).
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-localhost = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-mobile-push = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Device encryption (alpha blocker #3) ────────────────────────────────────
# rusqlite with the SQLCipher bundle does double duty:
#   1. Feature-unifies the single `libsqlite3-sys` build (also used by sqlx via
#      tauri-plugin-sql) to SQLCipher, so the whole DB is encryptable. Verify
#      on device: `PRAGMA cipher_version` must return a non-empty string.
#   2. Provides the connection + `rusqlite::ffi` symbols (sqlite3_auto_extension
#      / sqlite3_exec) used by secure_db.rs to key every connection and to run
#      the one-shot plaintext->encrypted migration.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
# DB key lives in the OS keychain (macOS Security.framework / iOS Keychain
# Services) -- never a plaintext file. iOS needs the keychain-access-group
# entitlement (Entitlements.plist) for this to succeed on device.
keyring = { version = "3", features = ["apple-native"] }
getrandom = "0.2"
base64 = "0.22"

# Apple-only: typed bindings to UNUserNotificationCenter for OS-level local
# notifications that survive the app being quit (macOS 10.14+ and iOS).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSArray",
    "NSBundle",
    "NSDate",
    "NSError",
    "NSPredicate",
    "NSSet",
    "NSDictionary",
    "NSEnumerator",
    "NSFileManager",
    "NSURL",
    "NSData",
    # Apple Reminders need a due-date as date *components* (year/month/day/hour/
    # minute) rather than an absolute NSDate; NSCalendar builds those from a date.
    "NSCalendar",
] }
# Apple-only: typed bindings to EventKit (EKEventStore) for two-way Calendar
# read/write — the de-risking foundation for the "Schedule" feature.
objc2-event-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "EKEventStore",
    "EKEvent",
    # EKReminder (Apple Reminders / to-dos) + EKAlarm (event & reminder alerts).
    "EKReminder",
    "EKAlarm",
    "EKCalendarItem",
    "EKCalendar",
    "EKObject",
    "EKTypes",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationTrigger",
    "UNNotificationSound",
    "UNUserNotificationCenter",
    # A3: custom action buttons on macOS via native categories + delegate.
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationResponse",
    "UNNotification",
] }
block2 = "0.6"

