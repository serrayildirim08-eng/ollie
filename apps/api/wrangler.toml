# Cloudflare Worker config for ollie's APNs sender + device-token register.
#
# Required secrets (set via `wrangler secret put` after Serra generates
# the APNs auth key in Apple Developer Portal):
#
#   APNS_KEY_ID      — 10-char key id shown next to the .p8 file
#   APNS_TEAM_ID     — 10-char team id from Membership page
#   APNS_BUNDLE_ID   — matches Capacitor capacitor.config.json appId (app.ollie.ollie)
#   APNS_AUTH_KEY    — full .p8 file contents including BEGIN/END lines
#   REGISTER_SHARED_SECRET — bearer token clients send when registering tokens
#
# Account deletion endpoint (Sprint B' · GDPR / App Store erasure path):
#
#   SUPABASE_URL              — already set for the cron handler. The
#                               /account/delete endpoint REQUIRES this
#                               PLUS the service-role key (below) — without
#                               them the route returns 503 service-unavailable.
#   SUPABASE_SERVICE_ROLE_KEY — same secret as the cron handler. Used to
#                               bypass RLS for cascade DELETEs and to call
#                               the Supabase Auth admin API
#                               (DELETE /auth/v1/admin/users/{id}).
#                               NEVER expose to the client.
#
# Optional:
#   APNS_USE_SANDBOX — set to "1" to send to api.sandbox.push.apple.com
#                      (development builds only; default = production)

name = "ollie-notifications"
main = "src/worker.ts"
compatibility_date = "2026-05-01"

[vars]
APNS_USE_SANDBOX = "0"
# Set to "1" once Supabase credentials are configured and the
# scheduled_jobs table is live (Sprint 4 / E4).
SCHEDULED_JOBS_ENABLED = "0"

# DECOMMISSIONED 2026-05-18 (audit item #1 — double-delivery cron).
#
# This worker's per-minute cron previously scanned `scheduled_jobs` and
# delivered pushes. The workers/cron worker (ollie-cron) now owns that
# scan on a 5-min schedule (flushNotificationQueue). Running both meant
# duplicate push delivery + a broken daily cap (two processes both
# counting + incrementing). The `[triggers]` block is removed so this
# worker no longer schedules a cron — it stays a pure HTTP worker
# (/register-token, /send, /account/delete). `runCron` is retained only
# behind the manual POST /cron/tick endpoint for local testing.
#
# ollie-notifications is NOT currently deployed (verified via
# `wrangler deployments list` — "Worker does not exist"), so removing
# the trigger needs no redeploy. If it is ever deployed, deploy this
# config so the cron does not arm.
#
# [triggers]
# crons = ["* * * * *"]

# Device-token store (D1 or KV — KV is simpler for the registration use case)
[[kv_namespaces]]
binding = "DEVICE_TOKENS"
id = "REPLACE_AFTER_wrangler_kv_create_DEVICE_TOKENS"
