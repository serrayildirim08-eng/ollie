# Security updates only.
# `open-pull-requests-limit: 0` switches off routine version-bump PRs while
# leaving Dependabot's security alerts and their fix PRs fully active. Turned
# down after the first run opened a wave of major-version bumps (actions v4->v7,
# pnpm/action-setup 4->6) that nobody had asked for.
# Security updates only.
# `open-pull-requests-limit: 0` switches off routine version-bump PRs while
# leaving Dependabot's security alerts and their fix PRs fully active. Turned
# down after the first run opened a wave of major-version bumps (typescript
# 5->7, zod 3->4, actions v4->v7) that nobody had asked for.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
      - "/workers/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      dev-dependencies:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
