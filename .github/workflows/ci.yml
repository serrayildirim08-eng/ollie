name: ci

on:
  push:
    branches: [main, redesign/olive-neumorphic]
  pull_request:
    branches: [main, redesign/olive-neumorphic]

jobs:
  voice-library-guard:
    name: voice library · banned-phrase scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install needed — scanner is plain Node, no deps.
      - name: scanner unit tests
        run: node tools/banned-phrases.test.cjs
      - name: scan codebase for banned phrases
        run: node tools/scan-banned-phrases.cjs

  build:
    name: typecheck + test
    runs-on: ubuntu-latest
    # Run the whole suite in UTC so timezone-sensitive tests in every
    # workspace package (not just packages/logic) match CI's expectation.
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
