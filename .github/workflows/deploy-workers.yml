name: deploy workers

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
  workflow_dispatch:

jobs:
  # Gate every deploy on the full suite passing (audit H6). Previously the
  # deploy workflow ran independently of ci.yml, so a push with failing tests
  # could still ship to production. Mirrors ci.yml's build job exactly.
  test:
    name: test gate
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  deploy-ai-proxy:
    name: deploy · ai-proxy
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ai-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        run: pnpm install
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/ai-proxy

  deploy-cron:
    name: deploy · cron
    runs-on: ubuntu-latest
    # cron has [[services]] bindings APNS_PUSH -> ollie-apns-push and
    # AI_PROXY -> ollie-ai-proxy. A service binding to a worker that does not
    # yet exist fails `wrangler deploy`, so cron MUST deploy after both targets.
    needs: [test, deploy-ai-proxy, deploy-apns-push]
    defaults:
      run:
        working-directory: workers/cron
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        run: pnpm install
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cron

  deploy-apns-push:
    name: deploy · apns-push
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/apns-push
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        run: pnpm install
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/apns-push

  deploy-sentry-tunnel:
    name: deploy · sentry-tunnel
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/sentry-tunnel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        run: pnpm install
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/sentry-tunnel
